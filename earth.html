<head>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Serif+KR:wght@300;400&display=swap');
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03070f;color:#e3f4fa} body{font-family:"Noto Serif KR",serif;cursor:grab} body.dragging{cursor:grabbing;user-select:none} canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}.top{position:fixed;top:28px;left:32px;right:32px;display:flex;justify-content:space-between;z-index:2;font:10px "DM Mono",monospace;letter-spacing:.19em}.top span{color:rgba(209,241,250,.62)}.top strong{font-weight:500;color:#d6fbff}.caption{position:fixed;left:32px;bottom:28px;z-index:2}.caption p{font:10px "DM Mono",monospace;letter-spacing:.16em;color:#82aab7;margin:0 0 13px}.caption h1{font-weight:300;letter-spacing:-.065em;line-height:1.12;font-size:clamp(28px,4vw,54px);margin:0}.caption h1 em{font-style:normal;color:#8fe5e0}.hint{position:fixed;right:32px;bottom:28px;z-index:2;text-align:right;font:10px "DM Mono",monospace;letter-spacing:.13em;line-height:1.8;color:rgba(213,244,250,.5)}.axis{position:fixed;left:50%;top:50%;width:1px;height:min(75vh,720px);background:linear-gradient(transparent,rgba(173,240,247,.22),transparent);transform:translate(-50%,-50%) rotate(23.5deg);pointer-events:none}@media(max-width:600px){.top{top:18px;left:19px;right:19px}.caption{left:20px;bottom:20px}.hint{right:20px;bottom:20px;font-size:8px}}

<body><canvas id="space"></canvas><div class="axis"></div><div class="top"><strong>PALE BLUE / 01</strong><span id="coords">35.6762° N / 139.6503° E</span></div><div class="caption"><p>AN INTERACTIVE ORBITAL STUDY</p><h1>&#51648;&#44396;&#45716; &#51221;&#51648;&#54616;&#51648; &#50506;&#45716;&#45796;.<br><em>&#45817;&#49888;&#51032; &#49552;&#45225;&#46112;&#46020;.</em></h1></div><div class="hint">DRAG TO ROTATE<br>SCROLL TO ZOOM</div>
<script>
const c=document.querySelector('#space'),x=c.getContext('2d');let W,H,D,R,yaw=-1.9,pitch=.28,zoom=1,drag=null,frame=0;
const stars=Array.from({length:440},(_,i)=>({x:(i*73.17%1),y:(i*31.73%1),r:(i%9===0?1.25:.45),a:.18+(i*17%70)/100}));
const land=[
 [[-168,71],[-145,70],[-128,55],[-122,48],[-110,32],[-99,19],[-86,23],[-81,9],[-77,-4],[-67,-17],[-58,-33],[-65,-53],[-76,-47],[-78,-18],[-92,6],[-105,17],[-117,29],[-123,42],[-141,56]],
 [[-12,36],[8,37],[28,31],[35,20],[43,12],[42,-4],[34,-18],[24,-34],[18,-35],[12,-24],[4,4],[-5,14],[-16,28]],
 [[-9,36],[11,44],[26,57],[52,59],[73,53],[100,61],[127,51],[143,47],[151,58],[160,61],[172,52],[158,38],[139,35],[121,23],[105,16],[100,5],[90,22],[77,30],[67,24],[57,27],[44,36],[33,40],[24,43],[13,42],[4,48]],
 [[112,-11],[130,-11],[143,-19],[151,-30],[146,-39],[133,-35],[119,-34],[113,-23]],
 [[-52,61],[-36,67],[-20,76],[-30,83],[-48,81],[-62,70]], [[47,-13],[51,-17],[49,-25],[44,-25]]
];
function resize(){D=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);R=Math.min(W,H)*.315*zoom}addEventListener('resize',resize);resize();
function point(lon,lat){let a=lon*Math.PI/180+yaw,b=lat*Math.PI/180;let X=Math.cos(b)*Math.cos(a),Y=Math.sin(b),Z=Math.cos(b)*Math.sin(a);let cp=Math.cos(pitch),sp=Math.sin(pitch),yy=Y*cp-Z*sp,zz=Y*sp+Z*cp;return{x:W/2+X*R,y:H/2-yy*R,z:zz}}
function line(points,color,width=1){x.beginPath();let begun=false;points.forEach(p=>{if(p.z>-.08){begun?x.lineTo(p.x,p.y):(x.moveTo(p.x,p.y),begun=true)}});x.strokeStyle=color;x.lineWidth=width;x.stroke()}
function cloudBand(lat,phase){let pts=[];for(let lon=-180;lon<=180;lon+=3)pts.push(point(lon,lat+Math.sin(lon*.07+phase)*4+Math.sin(lon*.16-phase)*1.4));line(pts,'rgba(217,250,247,.11)',1.2)}
function globe(){let cx=W/2,cy=H/2;let g=x.createRadialGradient(cx-R*.3,cy-R*.4,R*.03,cx,cy,R);g.addColorStop(0,'#4bb7bb');g.addColorStop(.24,'#16778b');g.addColorStop(.58,'#0b405b');g.addColorStop(.84,'#051c30');g.addColorStop(1,'#010914');x.fillStyle=g;x.beginPath();x.arc(cx,cy,R,0,Math.PI*2);x.fill();x.save();x.beginPath();x.arc(cx,cy,R,0,Math.PI*2);x.clip();
 for(let lat=-75;lat<=75;lat+=15)line(Array.from({length:91},(_,i)=>point(-180+i*4,lat)),'rgba(169,245,239,.13)');for(let lon=-165;lon<180;lon+=15)line(Array.from({length:51},(_,i)=>point(lon,-80+i*3.2)),'rgba(169,245,239,.11)');
 for(let k=0;k<6;k++)cloudBand(-54+k*20,frame*.008+k*.9);
 land.forEach(poly=>{let pts=poly.map(v=>point(v[0],v[1]));x.beginPath();let start=pts.find(p=>p.z>-.04);if(!start)return;x.moveTo(start.x,start.y);pts.forEach(p=>{if(p.z>-.04)x.lineTo(p.x,p.y)});x.closePath();let lg=x.createLinearGradient(cx-R,cy-R,cx+R,cy+R);lg.addColorStop(0,'rgba(166,246,193,.42)');lg.addColorStop(1,'rgba(39,137,111,.22)');x.fillStyle=lg;x.fill();x.strokeStyle='rgba(190,255,226,.48)';x.lineWidth=.7;x.stroke()});
 // polar ice, ocean currents, and metropolitan light field
 x.fillStyle='rgba(221,255,252,.26)';x.beginPath();x.ellipse(cx,cy-R*.91,R*.49,R*.15,0,0,Math.PI*2);x.fill();x.beginPath();x.ellipse(cx,cy+R*.91,R*.42,R*.13,0,0,Math.PI*2);x.fill();
 for(let i=0;i<230;i++){let lon=(i*47.31%340)-170,lat=(i*19.71%120)-60,p=point(lon,lat);if(p.z>0){x.fillStyle=`rgba(229,255,209,${.14+p.z*.48})`;x.fillRect(p.x,p.y,1.15,1.15)}}
 for(let i=0;i<12;i++){let q=point(-160+i*27,Math.sin(i*1.7)*35);if(q.z>0){x.beginPath();x.arc(q.x,q.y,2.5,0,Math.PI*2);x.fillStyle='rgba(119,255,233,.35)';x.fill()}}x.restore();
 x.beginPath();x.arc(cx,cy,R,0,Math.PI*2);x.strokeStyle='rgba(191,255,249,.7)';x.lineWidth=1;x.stroke();x.beginPath();x.arc(cx,cy,R*1.035,0,Math.PI*2);x.strokeStyle='rgba(95,240,237,.18)';x.stroke();let aura=x.createRadialGradient(cx,cy,R*.78,cx,cy,R*1.27);aura.addColorStop(0,'rgba(64,215,219,.1)');aura.addColorStop(.55,'rgba(64,215,219,.045)');aura.addColorStop(1,'rgba(64,215,219,0)');x.fillStyle=aura;x.fillRect(cx-R*1.3,cy-R*1.3,R*2.6,R*2.6)
}
function moon(){let a=frame*.0022-.7,cx=W/2+Math.cos(a)*R*1.38,cy=H/2+Math.sin(a)*R*.46-R*.2,rm=R*.19;let halo=x.createRadialGradient(cx,cy,rm*.65,cx,cy,rm*2.2);halo.addColorStop(0,'rgba(206,235,255,.13)');halo.addColorStop(1,'rgba(206,235,255,0)');x.fillStyle=halo;x.fillRect(cx-rm*2.2,cy-rm*2.2,rm*4.4,rm*4.4);let mg=x.createRadialGradient(cx-rm*.28,cy-rm*.3,rm*.08,cx,cy,rm);mg.addColorStop(0,'#edf3f1');mg.addColorStop(.57,'#a9b8bf');mg.addColorStop(.78,'#516573');mg.addColorStop(1,'#152431');x.beginPath();x.arc(cx,cy,rm,0,Math.PI*2);x.fillStyle=mg;x.fill();x.save();x.clip();for(let i=0;i<18;i++){let qx=cx+Math.sin(i*48.4)*rm*.68,qy=cy+Math.cos(i*27.1)*rm*.68,rr=rm*(.025+(i%5)*.022);x.beginPath();x.arc(qx,qy,rr,0,Math.PI*2);x.fillStyle='rgba(50,67,79,.28)';x.fill();x.beginPath();x.arc(qx-rr*.25,qy-rr*.25,rr*.68,0,Math.PI*2);x.strokeStyle='rgba(242,250,249,.2)';x.stroke()}let shade=x.createLinearGradient(cx-rm,cy,cx+rm,cy);shade.addColorStop(0,'rgba(2,11,20,.02)');shade.addColorStop(.52,'rgba(2,11,20,.08)');shade.addColorStop(1,'rgba(2,11,20,.7)');x.fillStyle=shade;x.fillRect(cx-rm,cy-rm,rm*2,rm*2);x.restore();x.beginPath();x.arc(cx,cy,rm,0,Math.PI*2);x.strokeStyle='rgba(231,248,255,.55)';x.stroke();x.fillStyle='rgba(210,240,255,.72)';x.font='9px DM Mono';x.fillText('LUNA / 384,400 KM',cx-rm,cy+rm+18)}
function orbit(){let cx=W/2,cy=H/2;for(let i=0;i<3;i++){x.save();x.translate(cx,cy);x.rotate(-.37+i*.43);x.scale(1,.28);x.beginPath();x.arc(0,0,R*(1.15+i*.17),-.2,Math.PI+.45);x.strokeStyle=`rgba(115,235,231,${.16-i*.025})`;x.lineWidth=1;x.stroke();x.restore()}let p=point(139,36);if(p.z>0){x.beginPath();x.arc(p.x,p.y,4+Math.sin(frame*.06)*1.5,0,Math.PI*2);x.strokeStyle='rgba(226,255,248,.8)';x.stroke();x.fillStyle='#e8fff9';x.fillRect(p.x-1,p.y-1,2,2)}}
function draw(){frame++;x.fillStyle='#03070f';x.fillRect(0,0,W,H);stars.forEach(s=>{let a=s.a*(.65+.35*Math.sin(frame*.015+s.x*18));x.fillStyle=`rgba(182,232,255,${a})`;x.fillRect(s.x*W,s.y*H,s.r,s.r)});orbit();globe();moon();requestAnimationFrame(draw)}draw();
c.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,yaw,pitch};c.setPointerCapture(e.pointerId);document.body.classList.add('dragging')});c.addEventListener('pointermove',e=>{if(!drag)return;yaw=drag.yaw+(e.clientX-drag.x)*.008;pitch=Math.max(-1.22,Math.min(1.22,drag.pitch-(e.clientY-drag.y)*.008));let lon=(((yaw*180/Math.PI+180)%360+360)%360-180).toFixed(1),lat=(pitch*180/Math.PI).toFixed(1);document.querySelector('#coords').textContent=`${Math.abs(lat)}° ${lat>=0?'N':'S'} / ${Math.abs(lon)}° ${lon>=0?'E':'W'}`});['pointerup','pointercancel'].forEach(n=>c.addEventListener(n,()=>{drag=null;document.body.classList.remove('dragging')}));c.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.max(.68,Math.min(1.35,zoom-e.deltaY*.0007));resize()},{passive:false});
</script></body></html>
